<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Search</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif; background: #fff; color: #202124;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 70px 20px 40px; }
  .logo {
    text-align:center; font-size:56px; font-weight:600; letter-spacing:-4px; margin-bottom:28px;
  }
  .logo span:nth-child(1), .logo span:nth-child(4) { color:#4285f4; }
  .logo span:nth-child(2), .logo span:nth-child(6) { color:#ea4335; }
  .logo span:nth-child(3) { color:#fbbc05; }
  .logo span:nth-child(5) { color:#34a853; }
  .search {
    display:flex; align-items:center; border:1px solid #dfe1e5; border-radius:24px;
    padding: 5px 8px 5px 18px; box-shadow:0 1px 6px rgba(32,33,36,.15);
  }
  input {
    border:0; outline:0; flex:1; font-size:17px; padding:10px 4px; min-width:0;
  }
  button {
    border:0; border-radius:20px; background:#1a73e8; color:white; padding:10px 18px;
    font-size:15px; cursor:pointer;
  }
  .hint { text-align:center; color:#5f6368; margin-top:22px; font-size:14px; }
  .result { display:none; margin-top:42px; animation: pop .45s ease; }
  .tiny { color:#5f6368; font-size:13px; margin-bottom:16px; }
  .card {
    border:1px solid #dadce0; border-radius:16px; padding:28px;
    box-shadow:0 2px 10px rgba(60,64,67,.12); text-align:center;
  }
  .yes { font-size:58px; font-weight:800; margin:4px 0 12px; }
  .names { font-size:23px; font-weight:700; line-height:1.4; }
  .heart { color:#e91e63; }
  .message { margin-top:15px; font-size:17px; color:#3c4043; line-height:1.6; }
  .ring { font-size:45px; margin-top:12px; }
  .disclaimer { margin-top:24px; color:#80868b; font-size:12px; text-align:center; }
  @keyframes pop { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @media(max-width:520px) {
    .wrap { padding-top:45px; }
    .logo { font-size:44px; }
    .yes { font-size:48px; }
    .names { font-size:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" aria-label="Search">
    <span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
  </div>
  <div class="search">
    <input id="q" value="Will Durgesh Nandin Panda marry Priyabrata Dash?" aria-label="Search query">
    <button onclick="showResult()">Search</button>
  </div>
  <div id="hint" class="hint">Tap Search to reveal the answer ✨</div>

  <div id="result" class="result">
    <div class="tiny">About 1 very special result ❤️</div>
    <div class="card">
      <div class="yes">YES! <span class="heart">❤️</span></div>
      <div class="names">Durgesh Nandin Panda <span class="heart">+</span> Priyabrata Dash</div>
      <div class="ring">💍</div>
      <div class="message">
        Some questions are complicated.<br>
        This one apparently isn't. 😉<br><br>
        <strong>Answer from the universe: YES! ✨</strong>
      </div>
    </div>
    <div class="disclaimer">A playful surprise page — not an actual Google Search result.</div>
  </div>
</div>
<script>
function showResult() {
  document.getElementById('hint').style.display='none';
  document.getElementById('result').style.display='block';
  document.title='Yes ❤️';
}
document.getElementById('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter') showResult();
});
</script>
</body>
</html>
